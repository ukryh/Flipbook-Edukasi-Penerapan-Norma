*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);
  display:flex;flex-direction:column;

  padding-block:0;overflow:hidden}
a{color:var(--brand)}
button{font:inherit;color:inherit}

.bar h1{margin:0;font:600 1.05rem/1.2 var(--font-d);letter-spacing:.01em}
.bar h1 small{display:block;font:600 .72rem/1.3 var(--font-b);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--brand)}

.stage{flex:1;min-height:0;position:relative;touch-action:pan-y}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:2400px}
.book{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.25,1);will-change:transform}
.book::after{content:"";position:absolute;left:8%;right:8%;bottom:-26px;height:28px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(8,12,34,.38),rgba(8,12,34,0) 70%);transform:translateZ(-1px);pointer-events:none}
.leaf{position:absolute;top:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.45,.05,.25,1),z-index 0s linear .45s}
.leaf.flipped{transform:rotateY(-180deg)}
.book.narrow .leaf{visibility:visible;transition:transform .9s cubic-bezier(.45,.05,.25,1),z-index 0s linear .45s,visibility 0s linear 0s}
.book.narrow .leaf.flipped{visibility:hidden;transition:transform .9s cubic-bezier(.45,.05,.25,1),z-index 0s linear .45s,visibility 0s linear .9s}
.face{position:absolute;inset:0;overflow:hidden;background:var(--paper);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 10px 28px rgba(10,15,40,.22),0 1px 0 rgba(255,255,255,.4) inset}
.face.front{border-radius:3px 12px 12px 3px}
.face.back{transform:rotateY(180deg);border-radius:12px 3px 3px 12px}
.face.back.blank{background:var(--paper-back)}
.face.front::after,.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3}
.face.front::after{background:linear-gradient(90deg,rgba(10,15,40,.2),rgba(10,15,40,0) 9%)}
.face.back::after{background:linear-gradient(270deg,rgba(10,15,40,.2),rgba(10,15,40,0) 9%)}

.pg{position:relative;height:100%;overflow-y:auto;overscroll-behavior:contain;
  font-size:calc(var(--pw) / 24);line-height:1.38;padding:1.05em 1.15em 2.4em;color:var(--ink)}
.pg .folio{position:absolute;bottom:.7em;left:0;right:0;text-align:center;font-size:.72em;color:var(--muted);font-weight:700;pointer-events:none}
.pg h2{font:600 1.42em/1.12 var(--font-d);margin:.1em 0 .45em;text-wrap:balance}
.pg h3{font:600 1.02em/1.2 var(--font-d);margin:.6em 0 .25em}
.pg p{margin:.35em 0}
.pg ul,.pg ol{margin:.3em 0;padding-left:1.15em}
.pg li{margin:.18em 0}
.k{display:inline-block;font:800 .68em/1 var(--font-b);letter-spacing:.09em;text-transform:uppercase;color:var(--brand);background:var(--soft);padding:.5em .8em;border-radius:999px;margin-bottom:.7em}
.muted{color:var(--muted)}
.small{font-size:.84em}
sup.cite{font-size:.62em;line-height:0;margin-left:.1em}
sup.cite a{text-decoration:none;font-weight:800;color:var(--brand);padding:0 .1em;cursor:pointer}
.box{background:var(--soft);border-radius:.8em;padding:.7em .85em;margin:.55em 0}
.box b{font-family:var(--font-d);font-weight:600}
.big{font:600 1.12em/1.25 var(--font-d)}
.steps{list-style:none;padding:0;margin:.5em 0;counter-reset:s}
.steps li{display:grid;grid-template-columns:1.7em 1fr;gap:.55em;align-items:start;margin:.4em 0;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:700 .85em var(--font-d)}
.steps b{font-family:var(--font-d);font-weight:600}
.norm{--c:var(--brand);--cb:var(--soft);background:var(--cb);border-radius:.85em;padding:.65em .85em;margin:.55em 0}
.norm>b{display:block;font:600 1.08em/1.2 var(--font-d);color:var(--c);margin-bottom:.25em}
.norm dl{margin:0;display:grid;grid-template-columns:4.6em 1fr;gap:.15em .6em;font-size:.92em}
.norm dt{font-weight:800;color:var(--c)}
.norm dd{margin:0}
.nrm-agama{--c:var(--agama);--cb:var(--agama-bg)}
.nrm-susila{--c:var(--susila);--cb:var(--susila-bg)}
.nrm-sopan{--c:var(--sopan);--cb:var(--sopan-bg)}
.nrm-hukum{--c:var(--hukum);--cb:var(--hukum-bg)}
.tbl{width:100%;border-collapse:collapse;font-size:.92em;margin:.4em 0}
.tbl th,.tbl td{text-align:left;padding:.4em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:800;color:var(--muted);font-size:.85em;letter-spacing:.04em;text-transform:uppercase}
.tag{display:inline-block;padding:.05em .55em;border-radius:999px;font-weight:800;font-size:.8em;background:var(--cb,var(--soft));color:var(--c,var(--ink))}
textarea,select{width:100%;font:inherit;font-size:.95em;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:.6em;padding:.5em .65em;resize:none}
textarea:focus,select:focus{border-color:var(--brand)}
label.lb{display:block;font-weight:800;font-size:.9em;margin:.55em 0 .2em}
.btn{display:inline-block;border:0;background:var(--brand);color:var(--brand-ink);font:700 .95em var(--font-d);padding:.55em 1.1em;border-radius:999px;cursor:pointer;margin-top:.5em}
.btn.ghost{background:var(--soft);color:var(--ink)}
.toc{list-style:none;padding:0;margin:.4em 0}
.toc li{margin:0}
.toc button{width:100%;display:flex;justify-content:space-between;gap:.6em;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.3em .1em;cursor:pointer;font-size:.95em}
.toc button span:last-child{color:var(--muted);font-weight:700}
.toc button:hover span:first-child{color:var(--brand)}
.radios{display:flex;flex-wrap:wrap;gap:.4em;margin:.3em 0}
.radios label{border:1.5px solid var(--line);border-radius:999px;padding:.3em .8em;font-weight:700;font-size:.9em;cursor:pointer;background:var(--paper)}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.radios label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}

/* Puzzle */
.pz-top{display:flex;justify-content:space-between;font-weight:800;font-size:.85em;color:var(--muted)}
.pz-piece{margin:.5em 0;padding:.8em .9em;border-radius:.9em;background:var(--soft);border:2px dashed var(--line);font:600 1.08em/1.25 var(--font-d);min-height:3.6em;display:flex;align-items:center}
.pz-q{font-weight:800;font-size:.9em;margin:.4em 0 .3em}
.pz-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.nbtn{border:2px solid var(--c);background:var(--cb);color:var(--c);border-radius:.75em;padding:.55em .4em;font:600 .98em var(--font-d);cursor:pointer;line-height:1.1}
.nbtn:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.pz-fb{margin:.5em 0 0;font-size:.92em;min-height:3.4em}
.pz-fb .ok{color:var(--good);font-weight:800}
.pz-fb .no{color:var(--bad);font-weight:800}
.pz-res{text-align:center;padding:.8em 0}
.pz-res .score{font:700 3em/1 var(--font-d);color:var(--brand)}

/* Sampul */
.cover-pg{padding:0;background:var(--cover);color:#fff}
.cv{height:100%;padding:1.3em 1.3em 1.4em;display:flex;flex-direction:column;position:relative;background:
  radial-gradient(120% 70% at 100% 0%,rgba(110,120,255,.35),rgba(110,120,255,0) 60%),var(--cover)}
.cv-art{width:58%;align-self:center;margin:.3em 0 .6em;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));transform:rotate(-5deg)}
.cv-k{font:800 .72em/1.3 var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:#C7CCFF;margin:0}
.cv h1{font:700 2.55em/.98 var(--font-d);margin:.2em 0 .15em;letter-spacing:-.01em}
.cv-s{font:600 1.2em/1.2 var(--font-d);margin:0;color:#FFD98A}
.cv-m{font-size:.85em;color:#C7CCFF;margin:.5em 0 0}
.cv-a{margin:auto 0 0;font-weight:800;font-size:.9em}
.cv-hint{font-size:.74em;color:#AEB5FF;margin:.2em 0 0}
.back-pg .cv{justify-content:center;text-align:center;align-items:center}
.back-pg .cv h1{font-size:1.9em}

/* Kontrol */
.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 0 max(14px,env(safe-area-inset-bottom,0px))}
.nav{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:1.3rem;cursor:pointer;display:grid;place-items:center;font-weight:800}
.nav:disabled{opacity:.35;cursor:default}
.nav:not(:disabled):hover{border-color:var(--brand);color:var(--brand)}
.count{min-width:9.5em;text-align:center;font-weight:800;font-size:.9rem;color:var(--muted)}

/* Mode baca */
.reader{flex:1;min-height:0;overflow-y:auto;padding:8px 0 28px}
.reader .pg{--pw:420px;font-size:17px;height:auto;overflow:visible;width:min(100%,560px);margin:0 auto 18px;border-radius:16px;
  background:var(--paper);box-shadow:0 4px 18px rgba(10,15,40,.12);padding:1.3em 1.3em 2.6em}
.reader .cover-pg{padding:0}
.reader .cv{min-height:30em}
.reader .cover-pg,.reader .back-pg{overflow:hidden}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:0 0 6px}

@media (prefers-reduced-motion:reduce){.book,.leaf{transition-duration:.01s !important;transition-delay:0s !important}}

var NORMS=[['agama','Agama'],['susila','Kesusilaan'],['sopan','Kesopanan'],['hukum','Hukum']];
var NAME={agama:'Agama',susila:'Kesusilaan',sopan:'Kesopanan',hukum:'Hukum'};
var PIECES=[
 {t:'Beribadah sesuai agama dan kepercayaan masing-masing',ok:['agama'],why:'Perintah Tuhan. Sanksinya dosa. (hlm. 79)'},
 {t:'Selalu berbuat jujur dalam perkataan dan perbuatan',ok:['susila','agama'],star:1,why:'Bersumber dari suara hati. Sanksinya rasa bersalah dan malu. (hlm. 81)'},
 {t:'Menjaga nama baik orang tua dan diri sendiri',ok:['susila','sopan'],star:1,why:'Hati nurani. Sanksinya rasa malu dan menyesal. (hlm. 93)'},
 {t:'Mengucapkan salam dan meminta izin saat berkunjung ke rumah orang lain',ok:['sopan'],why:'Kebiasaan bergaul. Sanksinya ditegur atau dicemooh. (hlm. 94)'},
 {t:'Membiasakan antre',ok:['sopan'],why:'Kebiasaan masyarakat. Sanksi sosial. (hlm. 83)'},
 {t:'Menghormati kedua orang tua',ok:['sopan','agama','susila'],star:1,why:'Tata cara bergaul dengan yang lebih tua. Juga bisa dibaca sebagai perintah agama dan suara hati. (hlm. 93)'},
 {t:'Memakai seragam sekolah sesuai aturan yang ditetapkan',ok:['hukum'],why:'Tata tertib sekolah tertulis. Sanksi teguran atau panggilan orang tua. (hlm. 93, 84–85)'},
 {t:'Mematuhi peraturan lalu lintas',ok:['hukum'],why:'Aturan tertulis dari negara. Sanksi tegas. (hlm. 94–95)'},
 {t:'Memiliki kesadaran membayar pajak',ok:['hukum'],why:'Aturan pemerintah. Sanksi tegas. (hlm. 95)'},
 {t:'Tidak mengambil barang milik orang lain (keping tantangan)',ok:['agama','susila','sopan','hukum'],star:1,all:1,why:'Keempat norma berlaku: dosa, rasa bersalah dan malu, dicemooh, dan pidana (Pasal 362 KUHP). (hlm. 79, 86)'}
];
var pz={order:[],i:0,score:0,wrong:{},first:true,done:false,fb:''};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pzReset(){pz={order:shuffle(PIECES.map(function(_,i){return i})),i:0,score:0,wrong:{},first:true,done:false,fb:'',solved:false}}
pzReset();
function pzRender(){
  var box=document.getElementById('puzzle'); if(!box) return;
  if(pz.done){
    var msg=pz.score>=8?'Hebat! Kamu menemukan polanya.':pz.score>=5?'Bagus! Ulangi untuk memperkuat alasanmu.':'Tidak apa-apa. Baca lagi halaman 6–8, lalu coba lagi.';
    box.innerHTML='<div class="pz-res"><div>Skormu</div><div class="score">'+pz.score+'/'+PIECES.length+'</div><p>'+msg+'</p><button class="btn" type="button" data-act="pz-again">Main lagi</button></div>';
    return;
  }
  var p=PIECES[pz.order[pz.i]];
  var btns=NORMS.map(function(n){return '<button type="button" class="nbtn nrm-'+n[0]+'" data-act="pz-pick" data-n="'+n[0]+'"'+((pz.wrong[n[0]]||pz.solved)?' disabled':'')+'>'+n[1]+'</button>'}).join('');
  box.innerHTML='<div class="pz-top"><span>Keping '+(pz.i+1)+' dari '+PIECES.length+(p.star?' · ★':'')+'</span><span>Skor '+pz.score+'</span></div>'+
   '<div class="pz-piece">'+p.t+'</div><div class="pz-q">Norma mana yang paling mendasari tindakan ini?</div>'+
   '<div class="pz-grid">'+btns+'</div><div class="pz-fb" role="status" aria-live="polite">'+pz.fb+'</div>'+
   (pz.solved?'<button type="button" class="btn" data-act="pz-next">'+(pz.i===PIECES.length-1?'Lihat skor':'Keping berikutnya')+'</button>':'');
}
function pzPick(n){
  var p=PIECES[pz.order[pz.i]]; if(pz.solved) return;
  if(p.ok.indexOf(n)>-1){
    pz.solved=true;
    if(pz.first) pz.score++;
    var extra='';
    if(p.all) extra=' Tindakan ini berkaitan dengan keempat norma.';
    else if(p.ok[0]!==n) extra=' Bisa dipertahankan! Jawaban utama di kunci: '+NAME[p.ok[0]]+'.';
    else if(p.ok.length>1) extra=' ★ Bisa juga: '+p.ok.slice(1).map(function(x){return NAME[x]}).join(', ')+'.';
    pz.fb='<span class="ok">Tepat.</span> '+p.why+extra;
  }else{
    pz.wrong[n]=1; pz.first=false;
    pz.fb='<span class="no">Belum tepat.</span> Tanyakan: siapa yang menegur kalau tindakan ini tidak dilakukan, dan apa sanksinya?';
  }
  pzRender();
}
function pzNext(){
  if(pz.i>=PIECES.length-1){pz.done=true}else{pz.i++;pz.wrong={};pz.first=true;pz.solved=false;pz.fb=''}
  pzRender();
}

  var availH=H-40;
  if(S.forceReader||availH<300||W<220){return {mode:'reader',pw:0}}
  var wide=Math.min(W/2-4,availH/R,500);
  if(W>=720&&wide>=250){return {mode:'wide',pw:Math.floor(wide)}}
  var nar=Math.min(W-8,availH/R,470);
  if(nar<200){return {mode:'reader',pw:0}}
  return {mode:'narrow',pw:Math.floor(nar)};
}
function build(){
  var m=decideMode();
  var keepPage=(S.built?pageForF(S.f):0);
  S.mode=m.mode;S.pw=m.pw;
  var reader=S.mode==='reader';
  stage.hidden=reader;readerEl.hidden=!reader;ctrl.hidden=reader;
  modeB.textContent=reader?'Mode buku 3D':'Mode baca';
  modeB.setAttribute('aria-pressed',reader?'true':'false');
  bookEl.innerHTML='';readerEl.innerHTML='';S.leaves=[];
  if(reader){
    var hint=document.createElement('p');hint.className='hint';hint.textContent='Mode baca: gulir ke bawah untuk membaca semua halaman.';
    readerEl.appendChild(hint);
    for(var i=0;i<N;i++){readerEl.appendChild(pageEl(i))}
    S.built=true;afterBuild();return;
  }
  bookEl.style.setProperty('--pw',S.pw+'px');bookEl.classList.toggle('narrow',S.mode==='narrow');
  bookEl.style.height=(S.pw*R)+'px';
  bookEl.style.width=(S.mode==='wide'?S.pw*2:S.pw)+'px';
  S.L=S.mode==='wide'?N/2:N;
  for(var k=0;k<S.L;k++){
    var leaf=document.createElement('div');leaf.className='leaf';
    leaf.style.width=S.pw+'px';leaf.style.height=(S.pw*R)+'px';
    leaf.style.left=(S.mode==='wide'?S.pw:0)+'px';
    var ff=document.createElement('div');ff.className='face front';
    var fb=document.createElement('div');fb.className='face back';
    if(S.mode==='wide'){ff.appendChild(pageEl(2*k));fb.appendChild(pageEl(2*k+1));ff.dataset.p=2*k;fb.dataset.p=2*k+1}
    else{ff.appendChild(pageEl(k));fb.classList.add('blank');ff.dataset.p=k;fb.dataset.p=-1}
    leaf.appendChild(ff);leaf.appendChild(fb);bookEl.appendChild(leaf);S.leaves.push(leaf);
  }
  S.f=Math.max(0,Math.min(maxF(),fForPage(keepPage)));
  S.built=true;
  apply(false);
  afterBuild();
}
function maxF(){return S.mode==='wide'?S.L:S.L-1}
function apply(){
  var f=S.f,L=S.L;
  S.leaves.forEach(function(lf,k){
    lf.classList.toggle('flipped',k<f);
    lf.style.zIndex=k<f?(k+1):(L-k);
  });
  var tx=0,tilt=0;
  if(S.mode==='wide'){
    if(f===0){tx=-S.pw/2;tilt=-9}
    else if(f>=L){tx=S.pw/2;tilt=9}
  }else{ if(f===0)tilt=-9 }
  bookEl.style.transform='translateX('+tx+'px) rotateY('+tilt+'deg)';
  updateUI();
}
function visiblePages(){
  if(S.mode==='wide'){var v=[];if(S.f>0)v.push(2*S.f-1);if(S.f<S.L)v.push(2*S.f);return v}
  return [S.f];
}
function updateUI(){
  var v=visiblePages();
  var label=v.length===2?'Halaman '+(v[0]+1)+'–'+(v[1]+1):('Halaman '+(v[0]+1));
  countEl.textContent=label+' dari '+N;
  prevB.disabled=S.f<=0;nextB.disabled=S.f>=maxF();
  bookEl.querySelectorAll('.face').forEach(function(fc){
    var p=parseInt(fc.dataset.p,10);
    fc.toggleAttribute('inert',v.indexOf(p)<0);
    fc.setAttribute('aria-hidden',v.indexOf(p)<0?'true':'false');
  });
}
function goF(nf,animateStagger){
  nf=Math.max(0,Math.min(maxF(),nf));
  if(nf===S.f)return;
  var dir=nf>S.f?1:-1,from=S.f,reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lo=Math.min(from,nf),hi=Math.max(from,nf),n=hi-lo;
  S.leaves.forEach(function(lf,k){
    if(k>=lo&&k<hi&&!reduce){
      var idx=dir>0?(k-lo):(hi-1-k);
      var d=Math.min(idx*70,700);
      lf.style.transitionDelay=d+'ms,'+(450+d)+'ms';
    }else lf.style.transitionDelay='';
  });
  S.f=nf;apply();
  setTimeout(function(){S.leaves.forEach(function(lf){lf.style.transitionDelay=''})},1800);
}
function goPage(p){
  if(S.mode==='reader'){
    var el=readerEl.querySelector('.pg[data-i="'+p+'"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  goF(fForPage(p));
}
function afterBuild(){
  /* simpan isi isian */
  document.querySelectorAll('[data-save]').forEach(function(el){
    var v=store.get(el.getAttribute('data-save'));if(v!==null)el.value=v;
    el.addEventListener('input',function(){store.set(el.getAttribute('data-save'),el.value)});
  });
  document.querySelectorAll('[data-saver]').forEach(function(el){
    var v=store.get(el.getAttribute('data-saver'));if(v!==null&&el.value===v)el.checked=true;
    el.addEventListener('change',function(){if(el.checked)store.set(el.getAttribute('data-saver'),el.value)});
  });
  pzRender();
}

/* ===== Interaksi ===== */
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){e.preventDefault();goPage(parseInt(g.getAttribute('data-go'),10)-1+0);return}
  var a=e.target.closest('[data-act]');
  if(a){
    var act=a.getAttribute('data-act');
    if(act==='pz-pick')pzPick(a.getAttribute('data-n'));
    else if(act==='pz-next')pzNext();
    else if(act==='pz-again'){pzReset();pzRender()}
  }
});
document.addEventListener('keydown',function(e){
  if(e.target.matches&&e.target.matches('a[data-go]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();return}
  if(e.target.matches&&e.target.matches('textarea,select,input'))return;
  if(S.mode==='reader')return;
  if(e.key==='ArrowRight')goF(S.f+1);
  else if(e.key==='ArrowLeft')goF(S.f-1);
});
prevB.addEventListener('click',function(){goF(S.f-1)});
nextB.addEventListener('click',function(){goF(S.f+1)});
modeB.addEventListener('click',function(){S.forceReader=!S.forceReader;build()});

var sx=0,sy=0,sdown=false;
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('button,a,textarea,select,input,label'))return;
  sdown=true;sx=e.clientX;sy=e.clientY;
});
stage.addEventListener('pointerup',function(e){
  if(!sdown)return;sdown=false;
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>1.5*Math.abs(dy)){goF(S.f+(dx<0?1:-1))}
});
stage.addEventListener('pointercancel',function(){sdown=false});

var rt;
window.addEventListener('resize',function(){
  clearTimeout(rt);rt=setTimeout(function(){
    var m=decideMode();
    if(m.mode!==S.mode||m.pw!==S.pw)build();
  },150);
});
build();
window.__pnk={S:S,goF:goF,goPage:goPage,N:N};
})();
</script>
